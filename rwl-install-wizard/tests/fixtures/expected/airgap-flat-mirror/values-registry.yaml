# Expected merged values-registry.yaml for the airgap-flat-mirror profile.
# INVARIANT: with flat-mirror + bundled-all, NO image may resolve to a public
# registry — every registry/repository/customImage/name below is on the mirror
# host (harbor.corp.example/runwhen). registryOverride covers first-party +
# chart-utility images; the per-subchart blocks cover the images it cannot reach.
#
# N1: the pinned subchart tags (neo4j 5.26.0, vault 1.21.2, bci-base 15.7) carry a
# verify-against-Chart.lock warning via x-airgap-pinned-tags-notice (a top-level
# key Helm ignores), because catalog emit COMMENTS are dropped on parse/merge.
x-airgap-pinned-tags-notice:
  warning: >-
    PINNED subchart image tags in this overlay target chart ~0.2.x. VERIFY
    each against your Chart.lock (run `helm dependency update`, then read
    Chart.lock) and the air-gap image manifest in your USER-GUIDE before
    installing — the mirror must hold the exact tag your chart resolves, or
    the image pull fails. These full-value overrides beat the chart's own
    resolved subchart pins.
  pinnedTags:
    neo4j: "5.26.0"
    vault: "1.21.2"
    bciBaseHelmTest: "15.7"
registryOverride: harbor.corp.example/runwhen
images:
  pullSecrets:
    - name: harbor-pull-secret
global:
  imagePullSecrets:
    - name: harbor-pull-secret
postgresql:
  spilo:
    image:
      registry: harbor.corp.example/runwhen/zalando
  pgbouncer:
    image:
      registry: harbor.corp.example/runwhen
redis:
  image:
    registry: harbor.corp.example/runwhen
    repository: bitnamilegacy/redis
neo4j:
  image:
    customImage: harbor.corp.example/runwhen/library/neo4j:5.26.0   # PINNED-TAG — verify vs Chart.lock
    imagePullSecrets:
      - harbor-pull-secret
vault:
  server:
    image:
      repository: harbor.corp.example/runwhen/hashicorp/vault
      tag: "1.21.2"                                                 # PINNED-TAG — verify vs Chart.lock
  autoUnseal:
    image:
      registry: harbor.corp.example/runwhen
  backup:
    image:
      registry: harbor.corp.example/runwhen
qdrant:
  image:
    repository: harbor.corp.example/runwhen/qdrant/qdrant
  imagePullSecrets:
    - name: harbor-pull-secret
  chartTests:
    dbInteraction:
      image: harbor.corp.example/runwhen/bci/bci-base:15.7          # PINNED-TAG — verify vs Chart.lock
metricstore:
  image:
    registry: harbor.corp.example/runwhen
seaweedfs:
  global:
    seaweedfs:
      image:
        name: harbor.corp.example/runwhen/chrislusf/seaweedfs
  image:
    repository: harbor.corp.example/runwhen/chrislusf/seaweedfs
