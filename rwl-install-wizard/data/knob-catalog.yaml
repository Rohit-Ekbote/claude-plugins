# knob-catalog.yaml — SOURCE OF TRUTH for rwl-install-wizard.
#
# MAINTENANCE CONTRACT: a new chart knob or a newly logged friction is an edit
# to THIS file (and a data/ file), never a change to the skills.
#
# chartCompat: ">=0.2.30 <0.3"
#
# AUTHORING RULES (enforced by lib/catalog-lint.sh):
#   - guide_sections / known_issues MUST be single-line inline arrays:
#       guide_sections: [some-id, other-id]
#   - emits: MUST NOT contain an inline secret literal. Wire secrets by name
#     (existingSecret / *Ref) only.
#   - Every option block (- id:) carries a label:. Axes carry title: + question:.
#
# FREE-VALUE INPUTS (params):
#   An axis (or option) may declare a `params:` list for non-sensitive free
#   values the operator types (domain, registry host, UID, StorageClass name).
#   Reference each param in `emits:` as an angle-bracket placeholder; the wizard
#   substitutes it from the operator's answer at GENERATE time. Example:
#       params:
#         - { id: domain, prompt: "Public base domain (e.g. rw.example.com)" }
#       emits:
#         ingress: { host: "papi.<DOMAIN>" }
#   Placeholders are <UPPER_SNAKE> of the param id. Never use a param for a
#   secret — params are shape facts only.
chartCompat: ">=0.2.30 <0.3"
axes:
  - id: networking
    title: Pod network CIDR
    question: "Is your cluster's pod network in standard private (RFC1918) ranges?"
    options:
      - id: rfc1918
        label: "Yes — 10.x / 172.16–31.x / 192.168.x (default)"
        emits: {}
        guide_sections: []
        known_issues: []
      - id: non-rfc1918
        label: "No — non-RFC1918 space (e.g. carrier/DoD 21.121.x)"
        overlay: values-cluster.yaml
        emits:
          metricstore:
            config:
              memberlist:
                bind_addr: ["127.0.0.1"]
                advertise_addr: "127.0.0.1"
        guide_sections: [networking-non-rfc1918]
        known_issues: [mimir-memberlist-no-private-ip]

  - id: cluster-shape
    title: Cluster environment
    question: "What domain and storage/ingress infrastructure does this cluster use?"
    params:
      - { id: domain, prompt: "Public base domain (e.g. rw.example.com)" }
      - { id: storageClass, prompt: "StorageClass name (e.g. standard-rwo, gp3, managed-csi)" }
      - { id: ingressClass, prompt: "IngressClass name (e.g. nginx, traefik)" }
    options:
      - id: clusterIssuer
        label: "cert-manager ClusterIssuer (ACME / Let's Encrypt or private ACME)"
        overlay: values-cluster.yaml
        params:
          - { id: tlsClusterIssuer, prompt: "cert-manager ClusterIssuer name (e.g. letsencrypt-prod)" }
        emits:
          global:
            domain: "<DOMAIN>"
          ingress:
            enabled: true
            className: "<INGRESS_CLASS>"
            allowSnippetAnnotations: true
            tls:
              enabled: true
              existingSecret: ""
              certManager:
                enabled: true
                clusterIssuer: "<TLS_CLUSTER_ISSUER>"
          seaweedfs:
            master:
              data:
                storageClass: "<STORAGE_CLASS>"
            volume:
              dataDirs:
                - name: data1
                  type: persistentVolumeClaim
                  size: "20Gi"
                  storageClass: "<STORAGE_CLASS>"
                  maxVolumes: 60
            filer:
              data:
                type: persistentVolumeClaim
                storageClass: "<STORAGE_CLASS>"
                size: 5Gi
          metricstore:
            persistence:
              storageClass: "<STORAGE_CLASS>"
          qdrant:
            persistence:
              storageClassName: "<STORAGE_CLASS>"
        guide_sections: [cluster-domain, storageclass, ingress-tls]
        known_issues: [papi-cors-csrf-custom-hosts, ingress-not-rendered, tls-clusterissuer-vs-issuer]

      - id: issuer
        label: "cert-manager Issuer (namespace-scoped; runner-control style)"
        overlay: values-cluster.yaml
        params:
          - { id: tlsIssuer, prompt: "cert-manager Issuer name (namespace-scoped, e.g. selfsigned-issuer)" }
        emits:
          global:
            domain: "<DOMAIN>"
          ingress:
            enabled: true
            className: "<INGRESS_CLASS>"
            allowSnippetAnnotations: true
            annotations:
              cert-manager.io/issuer: "<TLS_ISSUER>"
            tls:
              enabled: true
              existingSecret: ""
              certManager:
                enabled: true
                clusterIssuer: ""
          seaweedfs:
            master:
              data:
                storageClass: "<STORAGE_CLASS>"
            volume:
              dataDirs:
                - name: data1
                  type: persistentVolumeClaim
                  size: "20Gi"
                  storageClass: "<STORAGE_CLASS>"
                  maxVolumes: 60
            filer:
              data:
                type: persistentVolumeClaim
                storageClass: "<STORAGE_CLASS>"
                size: 5Gi
          metricstore:
            persistence:
              storageClass: "<STORAGE_CLASS>"
          qdrant:
            persistence:
              storageClassName: "<STORAGE_CLASS>"
        guide_sections: [cluster-domain, storageclass, ingress-tls]
        known_issues: [papi-cors-csrf-custom-hosts, ingress-not-rendered, tls-clusterissuer-vs-issuer]

      - id: byoSecret
        label: "Bring-your-own TLS Secret (pre-issued wildcard cert in the release namespace)"
        overlay: values-cluster.yaml
        params:
          - { id: tlsSecret, prompt: "Name of the pre-created Kubernetes TLS Secret holding *.<DOMAIN> cert (e.g. wildcard-rw-example-com-tls)" }
        emits:
          global:
            domain: "<DOMAIN>"
          ingress:
            enabled: true
            className: "<INGRESS_CLASS>"
            allowSnippetAnnotations: true
            tls:
              enabled: true
              existingSecret: "<TLS_SECRET>"
              certManager:
                enabled: false
          seaweedfs:
            master:
              data:
                storageClass: "<STORAGE_CLASS>"
            volume:
              dataDirs:
                - name: data1
                  type: persistentVolumeClaim
                  size: "20Gi"
                  storageClass: "<STORAGE_CLASS>"
                  maxVolumes: 60
            filer:
              data:
                type: persistentVolumeClaim
                storageClass: "<STORAGE_CLASS>"
                size: 5Gi
          metricstore:
            persistence:
              storageClass: "<STORAGE_CLASS>"
          qdrant:
            persistence:
              storageClassName: "<STORAGE_CLASS>"
        guide_sections: [cluster-domain, storageclass, ingress-tls]
        known_issues: [papi-cors-csrf-custom-hosts, ingress-not-rendered]

  - id: registry-routing
    title: Container registry routing
    question: "How do cluster nodes pull container images — direct from public upstreams, or via a customer-side mirror?"
    options:
      - id: connected
        label: "Connected — pull direct from public upstreams (no mirror)"
        emits: {}
        guide_sections: [registry-connected]
        known_issues: []

      - id: flat-mirror
        label: "Flat mirror — single mirror host fronts all upstreams (Harbor project, ECR pull-through, Distribution mirror)"
        overlay: values-registry.yaml
        params:
          - { id: registryHost, prompt: "Mirror registry host + path prefix (e.g. harbor.corp.example/runwhen or jcr.example.com/runwhen)" }
          - { id: pullSecretName, prompt: "Name of the pre-created Kubernetes image pull Secret (e.g. harbor-pull-secret)" }
        emits:
          registryOverride: "<REGISTRY_HOST>"
          images:
            pullSecrets:
              - name: "<PULL_SECRET_NAME>"
          global:
            imagePullSecrets:
              - name: "<PULL_SECRET_NAME>"
        guide_sections: [registry-flat-mirror, subchart-alias-mirroring]
        known_issues: [hardcoded-image-refs, thin-chart-subchart-aliases]

      - id: jfrog-per-upstream
        label: "JFrog per-upstream — one virtual repo per upstream registry (Artifactory / JCR)"
        overlay: values-registry.yaml
        params:
          - { id: registryHost, prompt: "JFrog / JCR hostname (e.g. jcr.example.com or artifactory.corp.example)" }
          - { id: pullSecretName, prompt: "Name of the pre-created Kubernetes image pull Secret (e.g. jcr-pull-secret)" }
        emits:
          global:
            imagePullSecrets:
              - name: "<PULL_SECRET_NAME>"
            utility:
              busybox:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
              dbInit:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
              vaultClient:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
          images:
            pullSecrets:
              - name: "<PULL_SECRET_NAME>"
            registry: "<REGISTRY_HOST>/docker-runwhen-self-hosted/runwhen-self-hosted/platform-images"
            mcpServer:
              registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
            ccCatalog:
              registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
            llmGateway:
              registry: "<REGISTRY_HOST>/docker-ghcr/berriai"
          runnerMetricProxy:
            image:
              registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
          postgresql:
            spilo:
              image:
                registry: "<REGISTRY_HOST>/docker-ghcr/zalando"
            pgbouncer:
              image:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
          vault:
            autoUnseal:
              image:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
            backup:
              image:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
          metricstore:
            image:
              registry: "<REGISTRY_HOST>/docker-dockerhub"
        guide_sections: [registry-jfrog-per-upstream, subchart-alias-mirroring]
        known_issues: [hardcoded-image-refs, embedder-airgap-hang, thin-chart-subchart-aliases, seaweedfs-image-chrislusf]
